<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ instance }}{% endblock %}</title>
<style>
  :root{
    --bg:#12141a; --panel:#191c24; --panel2:#1f232d; --line:#2b303c;
    --fg:#e6e9ef; --dim:#98a1b3; --accent:#6ea8ff;
    --good:#3ecf8e; --mid:#e8b84b; --bad:#e2606a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#eef0f4; --line:#d9dde5;
           --fg:#1b1e25; --dim:#5d6675; --accent:#2563eb; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;
         padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:5}
  header .brand{font-weight:700;letter-spacing:.4px}
  header nav a{color:var(--dim);font-size:14px} header nav a.on{color:var(--fg)}
  header nav{display:flex;gap:14px;flex:1}
  main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
  .muted{color:var(--dim)} .small{font-size:13px}
  button,input[type=submit]{background:var(--accent);color:#fff;border:0;border-radius:7px;
    padding:8px 14px;font-size:14px;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  input[type=text],input[type=number],input[type=password],select,textarea{
    background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px;font:inherit}
  textarea{width:100%;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .score{display:inline-block;min-width:42px;text-align:center;font-weight:700;
         border-radius:6px;padding:3px 7px}
  .s-strong{background:rgba(62,207,142,.16);color:var(--good)}
  .s-possible{background:rgba(232,184,75,.16);color:var(--mid)}
  .s-weak,.s-no{background:rgba(226,96,106,.14);color:var(--bad)}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;
       background:var(--panel2);color:var(--dim);border:1px solid var(--line);margin-right:4px}
  .row-title{font-weight:600}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  ul.clean{margin:6px 0 0;padding-left:18px} ul.clean li{margin:3px 0}
  pre.jd{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;padding:14px;max-height:520px;overflow:auto;font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <span class="brand">{{ instance }}</span>
  <nav>
    <a href="/" class="{{ 'on' if nav=='board' }}">Board</a>
    <a href="/mutes" class="{{ 'on' if nav=='mutes' }}">Dismissed</a>
    <a href="/sources" class="{{ 'on' if nav=='sources' }}">Sources</a>
    <a href="/settings" class="{{ 'on' if nav=='settings' }}">Settings</a>
  </nav>
  <form method="post" action="/run" class="bar">
    <input type="hidden" name="kind" value="full">
    <button {% if running %}disabled{% endif %}>{{ 'Running…' if running else 'Run now' }}</button>
  </form>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
